name: v2 CI

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'dist-v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-v2
          path: v2/dist
          retention-days: 7

      # 배포본이 소스와 어긋나면 알려만 준다.
      #
      # 처음에는 CI 가 스스로 다시 지어 커밋하게 했다. 그런데 리눅스(CI)와 윈도우(내 컴퓨터)는
      # 소스 파일의 줄바꿈이 달라(autocrlf) 번들 내용이 달라지고, 그래서 파일 이름의 해시까지
      # 달라진다. 서로가 서로의 빌드를 「어긋났다」 고 보고 끝없이 덮어썼다 —
      # 밀 때마다 되감기 충돌이 났다. 도움이 아니라 방해였다.
      #
      # 그래서 고치지 않고 짚어만 준다. 사람이 올리기 전에 npm run build 를 하면 된다.
      # (근본은 줄바꿈을 한 가지로 맞추는 것이다 — .gitattributes 로 eol=lf.
      #  저장소 전체를 다시 쓰는 일이라 따로 다룬다.)
      - name: 배포본이 소스와 어긋나는지 본다
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          if git diff --quiet -- dist-v2 ':(exclude)dist-v2/**/*.map'; then
            echo "배포본이 소스와 같다"
          else
            echo "::warning::배포본이 소스와 다르게 지어졌다. 줄바꿈 탓일 수 있고, 다시 짓지 않은 것일 수도 있다 — 올리기 전에 npm run build 를 확인한다"
            git diff --stat -- dist-v2 ':(exclude)dist-v2/**/*.map' | tail -3
          fi

  e2e:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (against live)
        env:
          E2E_BASE_URL: https://justanotepad.com/v2/
        run: npm run e2e
        continue-on-error: true # 라이브 의존 — 실패해도 빌드는 통과
