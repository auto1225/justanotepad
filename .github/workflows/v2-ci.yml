name: v2 CI

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'dist-v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'

jobs:
  test:
    runs-on: ubuntu-latest
    # 다시 지은 배포본을 스스로 커밋하기 위해 쓰기 권한이 필요하다
    permissions:
      contents: write
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-v2
          path: v2/dist
          retention-days: 7

      # 이 저장소는 커밋된 dist-v2/ 를 그대로 서빙한다. 소스만 고치고 다시 짓지 않으면
      # 깃에는 고침이 있는데 사이트에는 없는 상태가 된다 — 실제로 두 번 겪은 자리다.
      # 사람의 기억에 맡기지 않고, main 에 올라올 때마다 여기서 다시 지어 맞춘다.
      - name: 배포본이 소스와 어긋나면 다시 지어 커밋한다
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          if git diff --quiet -- dist-v2; then
            echo "배포본이 소스와 같다 — 할 일 없음"
            exit 0
          fi
          echo "::warning::배포본이 소스와 달랐다 — 다시 지어 커밋한다 (다음부터는 올리기 전에 npm run build)"
          git diff --stat -- dist-v2 | tail -5
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-v2
          git commit -m "배포본을 소스에 맞춘다 (CI 자동) [skip ci]"
          git push

  e2e:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (against live)
        env:
          E2E_BASE_URL: https://justanotepad.com/v2/
        run: npm run e2e
        continue-on-error: true # 라이브 의존 — 실패해도 빌드는 통과
